name: Update tax rates

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [fix-update]

permissions:
  contents: write

concurrency:
  group: update-tax-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out rates
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate rates
        run: |
          if [ -f rates.json ]; then
            python3 scripts/update_rates.py --previous rates.json --output rates.json
          else
            python3 scripts/update_rates.py --output rates.json
          fi

      - name: Validate JSON
        run: python3 -m json.tool rates.json > /dev/null

      - name: Commit and publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rates.json

          if git diff --cached --quiet; then
            echo "No rate changes."
            exit 0
          fi

          git commit -m "Update tax rates $(date -u +%Y-%m-%d)"
          git push
